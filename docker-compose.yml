version: '3.8'

services:
  db:
    image: postgres:16
    container_name: kittstudio-db
    environment:
      POSTGRES_USER: kittstudio
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kittstudio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
